<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="资料分析与图形推理每日固定练习"><title>上岸刷题</title><link rel="stylesheet" href="styles.css?v=20260922-display1"></head>
<body><header class="topbar"><a class="brand" href="#"><span>岸</span>上岸刷题</a><nav><button class="nav-btn active" id="todayBtn">今日刷题</button><button class="nav-btn" id="mistakesBtn">错题复盘</button><button type="button" class="top-timer" id="timerDisplay" title="点击暂停计时">00:00:00</button></nav><label class="bank-switch"><span>题库</span><select id="builtinBankSelect"><option value="data">资料分析</option><option value="graph">图形推理</option></select></label></header>
<main class="layout"><aside class="profile card"><div class="avatar" id="profileAvatar">资</div><h1 id="profileTitle">每日资料分析</h1><p class="muted" id="profileSubtitle">每天 2 篇材料 · 共 10 题</p><div class="stats"><div><strong id="bankCount">1015</strong><span>总题数</span></div><div><strong id="streakCount">0</strong><span>连续天数</span></div><div><strong id="accuracyCount">--</strong><span>正确率</span></div></div><div class="bank-summary"><div><span>本轮进度</span><strong id="roundText">0 / 1015</strong></div><div class="progress"><i id="roundBar"></i></div><small>刷完整套题库前不会重复</small></div><div class="calendar-nav"><button type="button" id="calendarPrevBtn" aria-label="上个月">‹</button><strong id="calendarMonth"></strong><button type="button" id="calendarNextBtn" aria-label="下个月">›</button></div><div class="calendar" id="calendar"></div></aside>
<section class="feed"><article class="hero card"><div class="hero-label"># 国考&nbsp;&nbsp;# 省考&nbsp;&nbsp;# 每日刷题</div><h2 id="pageTitle">今日资料分析 10 题 🔥</h2><p id="dateText"></p><div class="progress-row"><span id="progressText">0 / 10</span><div class="progress"><i id="progressBar"></i></div></div><div class="hero-actions"><button class="primary" id="startQuizBtn">开始答题</button></div></article><div id="quizList" class="quiz-list"></div><article id="resultCard" class="result card" hidden><div class="result-score"><strong id="scoreText">0 / 10</strong><span>今日成绩</span></div><div><h2 id="resultTitle">完成今日打卡</h2><p id="resultDetail" class="muted"></p></div><button class="primary" id="reviewBtn">复盘错题</button></article></section>
<aside class="right-column"><section class="card mini-panel"><h3>今日任务</h3><label><input type="checkbox" id="taskQuiz" disabled> <span id="taskQuizLabel">完成今日题目</span></label><label><input type="checkbox" id="taskReview" disabled> 提交并核对答案</label><div class="reminder-actions"><button type="button" id="emailReminderBtn">邮箱提醒</button></div></section><section class="card mini-panel"><h3>答题说明</h3><p class="muted">答题数据仅保存在当前浏览器。清除网站数据或更换设备前，请先导出记录。</p><div class="backup-actions"><button type="button" id="exportDataBtn">导出记录</button><button type="button" id="importDataBtn">导入记录</button><input type="file" id="importDataFile" accept="application/json,.json" hidden><small>换设备时导出，再在新设备导入</small></div></section><section class="card mini-panel bank-import"><h3>题库接入</h3><p class="muted" id="currentBankName">当前：26行测5000-资料分析</p><button type="button" id="importPdfBankBtn">导入 PDF 题库</button><button type="button" id="restoreBuiltinBankBtn" class="restore-bank" hidden>恢复内置题库</button><input type="file" id="pdfBankFile" accept="application/pdf,.pdf" hidden><small id="bankImportStatus">已预留 PDF 处理接口</small></section><section class="card mini-panel legend" id="bankLegend"><h3>题库说明</h3><p id="bankDescription">资料分析固定题序练习</p></section></aside></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="config.js?v=20260922-display1"></script><script src="bank-manifest.js?v=20260922-display1"></script><script src="card-bank.js?v=20260922-display1"></script><script src="graph-bank.js?v=20260922-display1"></script><script src="graph-card-bank.js?v=20260922-display1"></script><script src="question-bank-api.js?v=20260922-display1"></script><script src="app.js?v=20260922-display1"></script></body></html>
